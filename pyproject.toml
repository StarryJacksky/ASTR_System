[project]
name = "astr"
version = "0.1.0"
description = "ASTR System —— 露怀秋（秋秋）的主权 AI 内核：灵魂与算力解耦。"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "StarryJacksky", email = "xiaohu302a@126.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "chromadb>=1.5.9",
    "edge-tts>=7.2.8",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "miniaudio>=1.71",
    "huggingface-hub>=1.16.1",
    "jinja2>=3.1.6",
    "litellm>=1.89.0",
    "pillow>=11.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "redis>=8.0.0",
    "sherpa-onnx>=1.13.3",
    "sounddevice>=0.5.5",
    "structlog>=26.1.0",
    "uvicorn>=0.49.0",
    "mss>=10.2.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "keyboard>=0.13.5",
    "pyperclip>=1.11.0",
    "mcp>=1.28.1",
]

[project.optional-dependencies]
# 视觉感知件（P2-W6）：OmniParser-v2 推理栈。重依赖（torch CUDA ~3GB），刻意不进主依赖——
# 无 GPU / CI 环境不背；OmniPerceiver 懒加载，缺件时给指引。装法：uv sync --extra vision
vision = [
    "torch>=2.6",
    "torchvision",
    "ultralytics>=8.3.70",
    "transformers>=4.50",
    "timm",
    "einops",
    "accelerate",
    "rapidocr-onnxruntime",
]

[project.scripts]
astr = "astr.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "vision" }]
torchvision = [{ index = "pytorch-cu126", extra = "vision" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "fakeredis>=2.36.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行长由 formatter 管，lint 不重复报

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
